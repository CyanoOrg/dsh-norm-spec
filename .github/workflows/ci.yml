name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  ts-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # D017 floor guard: the supported host window keeps 0.1.0-rc.6 as its
  # floor, while the lockfile tracks npm latest (0.2.0-rc.2). Installing the
  # rc.6 peer pack over the checkout keeps the floor compile- and
  # unit-verified on every push; the host-compat seam (src/host-compat.ts)
  # must typecheck against both host lines.
  host-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the rc.6 floor pack (CLI overrides the dev line)
        # --legacy-peer-deps: the CLI pins intentionally differ from the
        # 0.2.0-rc.2 dev pins in package.json for this job only; strict
        # peer resolution rejects the deliberate mismatch.
        run: >
          npm install --no-save --legacy-peer-deps
          @deepseek-ai/cordis@4.0.1
          @deepseek-ai/dsh-agent@0.1.0-rc.6
          @deepseek-ai/dsh-attachment@0.1.0-rc.6
          @deepseek-ai/dsh-brand@0.1.0-rc.6
          @deepseek-ai/dsh-invariants@0.1.0-rc.6
          @deepseek-ai/dsh-llm@0.1.0-rc.6
          @deepseek-ai/dsh-scope@0.1.0-rc.6
          @deepseek-ai/dsh-session@0.1.0-rc.6
          @deepseek-ai/dsh-skill@0.1.0-rc.6
          @deepseek-ai/dsh-system-prompt@0.1.0-rc.6
          @deepseek-ai/dsh-timeout@0.1.0-rc.6
          @deepseek-ai/dsh-tools@0.1.0-rc.6
          @deepseek-ai/dsh-typert-protocol@0.1.0-rc.6
          @deepseek-ai/dsh-user-approval@0.1.0-rc.6
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/*.test.ts

  norm-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository .norm with the pinned engine release
        run: |
          # Same pinned upstream release the bridge seals locally
          # (scripts/build-local-runtime.sh); checksum-verified download.
          set -euo pipefail
          asset="norm-spec-0.1.0-rc.1-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/CyanoOrg/norm-spec/releases/download/v0.1.0-rc.1"
          curl -fsSL -o "$asset" "$base/$asset" -o "$asset.sha256" "$base/$asset.sha256"
          # Release .sha256 files list the bare asset name; verify then extract.
          shasum -a 256 --check --status "$asset.sha256"
          mkdir -p /tmp/norm-runtime
          tar xzf "$asset" -C /tmp/norm-runtime --strip-components=1
          /tmp/norm-runtime/bin/norm validate .norm --strict

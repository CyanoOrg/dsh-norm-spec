[workspace]
members = ["crates/dsh-norm-engine", "crates/dsh-norm-bridge"]
resolver = "3"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Wade <bravetwo@163.com>"]
repository = "https://github.com/CyanoOrg/dsh-norm-spec"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
